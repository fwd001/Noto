[workspace]
resolver = "2"
members = [
  "crates/notera-core",
  "crates/notera-richtext",
  "crates/notera-crypto",
  "crates/notera-store",
  "crates/notera-config",
  "crates/notera-net",
  "crates/notera-webdav",
  "crates/notera-sync",
  "crates/notera-importer",
  "crates/notera-host",
  "crates/notera-cli",
  "crates/notera-test-webdav",
  "apps/desktop/src-tauri",
]
exclude = ["tools/feasibility-probe"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/notera/notera"

[workspace.dependencies]
notera-core = { path = "crates/notera-core" }
notera-richtext = { path = "crates/notera-richtext" }
notera-crypto = { path = "crates/notera-crypto" }
notera-store = { path = "crates/notera-store" }
notera-config = { path = "crates/notera-config" }
notera-net = { path = "crates/notera-net" }
notera-webdav = { path = "crates/notera-webdav" }
notera-sync = { path = "crates/notera-sync" }
notera-importer = { path = "crates/notera-importer" }
notera-host = { path = "crates/notera-host" }
notera-test-webdav = { path = "crates/notera-test-webdav" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.11"
aes-gcm-siv = "0.12"
argon2 = "0.6"
rand = "0.9"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "gzip", "socks", "system-proxy", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "net", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
dashmap = "6"
bytes = "1"
quick-xml = "0.37"
percent-encoding = "2"
tempfile = "3"

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
