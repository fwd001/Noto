[package]
name = "notera-test-webdav"
description = "真实 TCP 的 HTTP/1.1 + WebDAV 子集测试服务器，带确定性故障注入（仅测试基建）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notera-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
quick-xml = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
percent-encoding = { workspace = true }
# TLS 源站（见根 Cargo.toml 那条注释）：只在测试里被链接。
rcgen = { workspace = true }
tokio-rustls = { workspace = true }

[dev-dependencies]
notera-test-webdav = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "fs"] }
