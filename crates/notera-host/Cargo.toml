[package]
name = "notera-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notera-core = { workspace = true }
notera-richtext = { workspace = true }
notera-crypto = { workspace = true }
notera-store = { workspace = true }
# 「今天」按**本地日历日**算（§1 的日记那一格）：按 UTC 会让 UTC+8 的用户在早上 8 点前
# 写到"昨天"那一篇去。依赖本身与 notera-store 用的是同一个 workspace 版本源。
chrono = { workspace = true }
notera-sync = { workspace = true }
notera-config = { workspace = true }
notera-net = { workspace = true }
notera-webdav = { workspace = true }
notera-importer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
# 只做一件事：给 RemoteBorrow 的转发 impl 用（引擎的 port 是 async trait）
async-trait = { workspace = true }

# 凭据库只有 Windows 这条路是接了的；别的平台上这个依赖根本不进图，
# `credential_store::available()` 直接返回 false（见 ADR-0020）。
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
notera-test-webdav = { workspace = true }
tokio = { workspace = true }
