[package]
name = "notera-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Notera 桌面/移动外壳（Tauri 2）"

[lib]
name = "notera_desktop_lib"
# 实测：Windows GNU 工具链下 cdylib 的 PE 导出表超限
# （`ld.exe: error: export ordinal too large: 119477`），桌面产物根本链不出来。
# Tauri 模板给移动端用的 staticlib/cdylib 在这里是纯负担 —— 移动壳（Phase 6）
# 由它自己的 crate 承担，桌面只要 rlib + bin。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 官方模板那一段：默认 = 生产模式（资源走内嵌的 `frontendDist`）。
# `tauri dev` 会自己带 --no-default-features 改走 devUrl。少了这一段，
# `cargo build --release` 出来的窗口会去连 127.0.0.1:5173 并停在空白错误页（实测踩过）。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
notera-host = { workspace = true }
notera-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
notera-test-webdav = { workspace = true }
