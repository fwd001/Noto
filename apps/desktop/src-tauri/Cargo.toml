[package]
name = "notera-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Noto 桌面/移动外壳（Tauri 2）"

[lib]
name = "notera_desktop_lib"
# 实测：Windows GNU 工具链下 cdylib 的 PE 导出表超限
# （`ld.exe: error: export ordinal too large: 119477`），桌面产物根本链不出来。
# Tauri 模板给移动端用的 staticlib/cdylib 在这里是纯负担 —— 移动壳（Phase 6）
# 由它自己的 crate 承担，桌面只要 rlib + bin。
crate-type = ["rlib"]

# ⚠ 不要在这里写 `[[bin]] windows_subsystem = "windows"`。
# `windows_subsystem` 是 **rustc 的 crate 属性**，不是 cargo 的 manifest key ——
# 写成这样 cargo 会给一条 `unused manifest key: bin.0.windows_subsystem` 警告，
# 而**exe 仍然是 console 子系统**（启动照样弹终端窗口）。
# 正确写法在 `src/main.rs`：
#   #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]
# 之所以加 `not(debug_assertions)`：`cargo run` 调试时保留控制台，
# 崩溃的第一现场（panic 信息）才有地方可看。

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 官方模板那一段：默认 = 生产模式（资源走内嵌的 `frontendDist`）。
# `tauri dev` 会自己带 --no-default-features 改走 devUrl。少了这一段，
# `cargo build --release` 出来的窗口会去连 127.0.0.1:5173 并停在空白错误页（实测踩过）。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
notera-host = { workspace = true }
notera-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
notera-test-webdav = { workspace = true }
