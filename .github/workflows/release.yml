name: 出包与发布（§4 / §5）

# 触发：**打 tag**（`v*`）、**在 Releases 页面 Publish**（`release: published`）、或手动 dispatch。
# 这是总指令 §4 的"通过打 Tag 或发布 Release 自动触发构建"那一格（两种写法都接上了），
# 也是 §5 的"通过 Git Tag、GitHub Release 管理正式版本"那一格 —— 之前仓库里只有 `ci.yml`
# （PR 门禁），一份出包流程都没有，`git tag` 数量是 0，GitHub Release 也是 0 个。
#
# 为什么 Release 默认发**草稿**（`draft: true`）：产物没有代码签名与公证（§13 的 D3，本机无证书），
# 直接公开发布等于把"未经签名验证的安装包"摆到公众面前，也等于替用户做了"这版可以发"的决定。
# 草稿状态下三平台的包都在 Actions 与 Release 草稿里可下载，用户看完再手动 Publish。
# 要改成直接发布：把下面 `draft` 改掉，并在那之前补上签名（secrets 见 §13）。
#
# 每一条命令都是本仓库已经跑通过的形状：Windows 走 **GNU 工具链**（`RUSTUP_TOOLCHAIN=…-gnu`，
# msvc host 在这个仓库编不出来 —— 见 CI-CD §环境与网络限制），pnpm 版本取自
# `apps/desktop/package.json` 的 `packageManager`，依赖走 `--frozen-lockfile`。

on:
  push:
    tags:
      - 'v*'
  # §4 原文是"支持通过打 Tag **或发布 Release** 自动触发构建"。只挂 tag 推送的话，
  # 在 Releases 页面上对**已有 tag** 点 Publish 是不会出包的（那条动作不产生 tag push 事件）。
  # 这里挂 `published`：`GITHUB_REF_NAME` 在这类事件里就是 tag 名 ⇒ meta 的"tag 与版本一致"判据
  # 原样适用；`publish` 那一步本来就是"Release 已存在就 `upload --clobber`，不存在才建草稿"，
  # 所以用户 Publish 之后重跑只会把这一版产物贴到那个 Release 上，不会撞建。
  # **不挂 `created`/`edited`**：草稿创建时用户往往还要改说明，那时候出一版三个小时的包是浪费；
  # 只在 Publish 这个真动作上出包。
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '要出的版本号（留空 = 取 Cargo.toml 的 workspace 版本，只出 Artifacts 不动 tag）'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: 版本与 tag 对齐（不一致就别开始三个小时的构建）
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # 判据是"三者一致"：Cargo.toml 的 workspace.package.version、apps/desktop/package.json、
      # tauri.conf.json。打 tag 时如果忘了 bump，就会出一个**版本号是上一版**的包 —— 那正是 §5
      # 要防的事，所以这一步失败要早、要响。
      - name: 版本单源（与 ci.yml 同一条命令）
        run: node scripts/check-versions.mjs

      - name: 算出版本号与 tag
        id: ver
        run: |
          set -euo pipefail
          cargo_v=$(grep -m1 -A2 '^\[workspace.package\]' Cargo.toml | grep -m1 '^version' | sed -E 's/.*"([^"]+)".*/\1/')
          ref="${GITHUB_REF_NAME}"
          if [ -n "${{ github.event.inputs.version }}" ]; then ref="v${{ github.event.inputs.version }}"; fi
          if [ "${ref#v}" != "$cargo_v" ]; then
            case "$ref" in
              v*) echo "::error::tag=$ref 与 Cargo.toml 版本=$cargo_v 不一致：先 bump 或改 tag 再出包"; exit 1;;
              *) echo "手动 dispatch 且没给版本号：只出 Artifacts，用 Cargo.toml 的 $cargo_v"; ref="v$cargo_v";;
            esac
          fi
          echo "version=$cargo_v" >> "$GITHUB_OUTPUT"
          echo "tag=${ref#v}" >> "$GITHUB_OUTPUT"
          echo "### 出包版本：$cargo_v（tag $ref）" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows（GNU 工具链：.msi + .exe）
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUST_TARGET: x86_64-pc-windows-gnu
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4

      - name: 安装 GNU 工具链（rustup）
        run: |
          rustup toolchain install stable-$env:RUST_TARGET --profile default --component rustfmt --component clippy
          rustup default stable-$env:RUST_TARGET
          rustc -Vv

      - name: 准备 pnpm（版本取自 apps/desktop/package.json 的 packageManager）
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: 依赖安装（frozen lockfile）
        run: pnpm --dir apps/desktop install --frozen-lockfile

      # `RUSTUP_TOOLCHAIN` 必须在 env 里，不只靠 `--target`：build script 与 proc macro 永远按
      # **host triple** 编，而镜像默认 host 是 msvc → 它去调被 Git Bash coreutils `link` 顶掉的
      # `link.exe`，报一串"第三方 crate 编不过"。这条在本机踩过两次（CI-CD §环境与网络限制第 15 条）。
      - name: 出包（nsis + msi）
        run: pnpm --dir apps/desktop tauri build --target x86_64-pc-windows-gnu --bundles nsis,msi -v

      # §4 "包可正常安装/启动"里不依赖用户手动装就能核的那半（CI-CD.md L6）。
      # 步骤本体放在 `scripts/verify-windows-package.ps1`（带 BOM 的仓库文件），本机复演教了三件事：
      #   ① run 体里的中文会写成临时 .ps1 再喂给 PowerShell，那条路上没 BOM ⇒ 当 ANSI 读 ⇒
      #      "字符串缺少终止符"，整步还没执行就红；
      #   ② `$LASTEXITCODE` 在 `& script.ps1` 之后**不代表那个脚本**（只由原生命令设置），
      #      所以"生成器失败就红"那句写出来永远为假 —— 判据换成"报告文件真在且有内容"；
      #   ③ `Select -First 1` 挑包会挑到**最旧**那个（本机 bundle 目录里留着 0.0.28~0.0.41 一整排），
      #      那等于给上一版的包作保 ⇒ 改成按文件名里的版本号挑，并在断言里再查一遍报告是不是这一版。
      # `/a` 是管理员解包：只解到指定目录，不写注册表、不装程序。
      - name: 结构校验这两个安装包（解包 + 主程序 + WebView2 加载器 + 包内版本号）
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/verify-windows-package.ps1 `
            -BundleDir target/x86_64-pc-windows-gnu/release/bundle `
            -Version '${{ needs.meta.outputs.version }}' `
            -TempDir $env:RUNNER_TEMP `
            -StepSummary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { throw "Windows 产物结构校验没过（退出 $LASTEXITCODE）" }

      - name: 收集产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-gnu/release/bundle/msi/*.msi
          if-no-files-found: error

  macos:
    name: macOS（.dmg + .app，未签名）
    needs: meta
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（stable）
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv

      - name: 准备 pnpm（版本取自 apps/desktop/package.json 的 packageManager）
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: 依赖安装（frozen lockfile）
        run: pnpm --dir apps/desktop install --frozen-lockfile

      # 没配 APPLE_CERTIFICATES / notaryteam secrets（§13 D3）→ 出**未签名**包。
      # `--no-sign` 那类开关不写：Tauri 在没有签名身份时本来就不签，但产物要用户手动"允许打开"，
      # 这一条写进 Release 说明里，不留"macOS 包可直接安装"的错觉。
      - name: 出包（dmg + app）
        run: pnpm --dir apps/desktop tauri build --bundles dmg,app -v

      # §4 的"包可安装/可启动"在 macOS 这一腿上的结构校验（CI-CD.md L6）。
      # 挂 .dmg 就是"安装"这一步的等价动作（拖进 Applications 不需要管理员权限），
      # 读的是 bundle 自己的声明 —— 版本号有没有退回默认、主程序是不是真的 Mach-O，
      # 这些在"打包成功"里都看不见。任何一环读不到就红，不 skip（§40）。
      - name: 结构校验这个 .dmg（挂载 + bundle 声明 + 主程序是 Mach-O）
        run: |
          set -uo pipefail
          mkdir -p /tmp/diag
          DMG=$(ls -1 target/release/bundle/dmg/*.dmg 2>/dev/null | head -1 || true)
          MNT=/Volumes/notera-check
          # 不管过不过，整段现场（挂载结果、卷里有什么、plutil 全文、file 读数、门禁说了什么）
          # 都写进 /tmp/diag/macos.txt —— 这一步是新加的，真 runner 上的形状我没法在本机复现，
          # 红的时候必须能看见"到底哪儿不对"，不然就是一轮瞎猜。
          # 用**子 shell**跑这一段：里面的 `exit 1` 只结束这段读数，外面的 rc / 卸载 / 摘要写入照常走
          # （写成 `{ …; }` 的话 `exit` 会直接把整个步骤带走，`rc=$?` 与 detach 都轮不到执行）。
          (
            echo "DMG=[$DMG]"
            [ -n "$DMG" ] || { echo "没有 .dmg 产物"; exit 1; }
            hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
            APP=$(find "$MNT" -maxdepth 2 -name '*.app' -type d | head -1)
            echo "APP=[$APP]"
            [ -n "$APP" ] || { echo "卷里找不到 .app"; exit 1; }
            plutil -p "$APP/Contents/Info.plist" > /tmp/infoplist.txt
            # 主程序名从已经读出来的那份 plutil 文本里取，**不再叫第二次 plutil**：
            # `-extract … raw -o -` 这种写法在不同 macOS 版本上的行为我没在这台机器上验得了，
            # 少一个没验过的调用就少一个可能把这条绿 job 演成红的地方。
            EXE=$(sed -n 's/.*"CFBundleExecutable" => "\(.*\)"/\1/p' /tmp/infoplist.txt | head -1)
            echo "EXE=[$EXE]"
            [ -n "$EXE" ] || { echo "Info.plist 里没有 CFBundleExecutable"; exit 1; }
            file "$APP/Contents/MacOS/$EXE" > /tmp/macho.txt
            echo '--- plutil 全文'; cat /tmp/infoplist.txt
            echo '--- file 读数'; cat /tmp/macho.txt
            echo '--- 门禁读数'
            node scripts/check-macos-bundle.mjs /tmp/infoplist.txt \
              --version "${{ needs.meta.outputs.version }}" --file /tmp/macho.txt
          ) > /tmp/diag/macos.txt 2>&1
          rc=$?
          cat /tmp/diag/macos.txt
          # 挂了就必须卸载：泄漏的挂载点会让这台 runner 后面的步骤读到旧卷
          hdiutil detach "$MNT" -force >/dev/null 2>&1 || true
          if [ "$rc" -eq 0 ]; then
            {
              echo "### macOS 产物核对（§4）"
              echo "- 镜像：\`$(basename "$DMG")\`（$(wc -c <"$DMG") 字节），已挂载并读出 bundle"
              echo "- SHA-256：\`$(shasum -a 256 "$DMG" | cut -c1-64)\`"
              cat /tmp/macho.txt
              grep -E 'CFBundle(ShortVersionString|Identifier|Executable|PackageType)' /tmp/infoplist.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

      # macOS 这条 job 原本没有"把现场递回来"的通道（未认证读不到 job 日志正文 = 403、
      # 产物字节 = 401，这两条都在 Android 那腿上实测过）。红的时候靠这条评论通道读全文。
      - name: 把结构校验的现场贴成 commit 评论（诊断用，修好就删）
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-diagnostic.mjs --file /tmp/diag/macos.txt --label "macOS 产物结构校验的现场"

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          if-no-files-found: error

  android:
    name: Android（.apk，debug 签名；无 secrets）
    needs: meta
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust + Android 目标三元组
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          rustc -Vv

      # JDK 17 是 AGP 8 的硬要求。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # **为什么不用 android-actions/setup-android**：第一次跑就红在这一步，而未认证读不到
      # 日志正文（`/actions/jobs/{id}/logs` = 403，见 CI-CD §环境与网络限制）—— 那等于只能靠猜改代码，
      # 而猜出来的修法本身又是下一个假绿的来源。GitHub 的 ubuntu-22.04 runner **本身就带 Android SDK**，
      # 所以这里只用自带的那份：NDK 版本从目录里读，读不到再用 sdkmanager 装，
      # 并且把"我看到了什么"写成**产物名字**（产物名在未认证的 `/actions/runs/{id}/artifacts` 里可读）
      # —— 这是当前权限下唯一能把环境事实递出来的通道。
      - name: 定位 SDK 与 NDK（自带优先，缺了就装）
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?runner 没给 ANDROID_HOME}"
          echo "SDK=$ANDROID_HOME"
          ndk=""
          if [ -d "$ANDROID_HOME/ndk" ]; then ndk=$(ls -1 "$ANDROID_HOME/ndk" | tail -1 || true); fi
          if [ -z "$ndk" ]; then
            yes | sdkmanager --licenses > /tmp/lic.log 2>&1 || true
            if sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" > /tmp/ndk.log 2>&1; then
              ndk=26.1.10909125
            else
              tail -5 /tmp/ndk.log
              echo "sdkmanager 装 NDK 失败，末行摘要=$(tail -1 /tmp/ndk.log | tr -dc '[:print:]' | cut -c1-60)"
              mkdir -p /tmp/diag && echo "no-ndk" > /tmp/diag/note.txt
              cp /tmp/ndk.log /tmp/diag/ndk.log || true
            fi
          fi
          test -n "$ndk"
          echo "NDK_VER=$ndk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          echo "用 NDK：$ndk"

      - name: 装不上时把证据递出来（产物名就是摘要）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-failure-${{ needs.meta.outputs.version }}
          path: /tmp/diag/
          if-no-files-found: ignore

      - name: 准备 pnpm（版本取自 apps/desktop/package.json 的 packageManager）
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: 依赖安装（frozen lockfile）
        run: pnpm --dir apps/desktop install --frozen-lockfile

      # 移动壳**复用**桌面那份前端产物（apps/mobile/src-tauri/tauri.conf.json 的
      # frontendDist = ../../desktop/dist）。所以这里先 build 桌面前端，一次即可，
      # 不留 beforeBuildCommand 里的第二次构建（两处产物不同步就是"手机上跑的是旧界面"）。
      - name: 前端构建（移动壳用的就是这份 dist）
        run: pnpm --dir apps/desktop build

      # **为什么必须在 apps/mobile 里跑**：run #5 的产物名把根因递回来了 ——
      # `could not compile notera-desktop (lib) due to 13 previous errors`，头两条是
      # `no method named 'on_menu_event'`、`no method named 'tray_by_id'`（桌面那套 muda/托盘 API
      # 在 Android 上根本不存在）。`--config` 只换**配置文件**，不换**要编的那个 crate**：
      # 工作目录留在 apps/desktop 时，CLI 的 app path 就是 `apps/desktop/src-tauri`，
      # 于是它拿桌面壳去链 aarch64。换到移动壳的目录里跑，编的才是 `notera-mobile`
      # （crate-type 带 cdylib + `#[mobile_entry_point]`，桌面壳那个 crate 是 rlib，本来就是两回事）。
      - name: 生成 Android 工程（tauri android init）
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          test -d "$NDK_HOME" || { echo "NDK_HOME 指错了：$NDK_HOME"; exit 1; }
          # 不走 `pnpm exec`：pnpm 的 workspace 根在 apps/desktop，而 apps/mobile 里没有 package.json，
          # 在那个目录里 `pnpm exec` 直接找不到工程。CLI 是桌面那份依赖里的 shim，按路径叫它。
          TAURI="$GITHUB_WORKSPACE/apps/desktop/node_modules/.bin/tauri"
          test -x "$TAURI" || { echo "CLI 不在 Expected 位置：$TAURI"; exit 1; }
          # **不传 `--config`**：apps/mobile 下默认就找 `src-tauri/tauri.conf.json`（run #13 证明这条路
          # 是通的——它已经走到 gradle）。传了反而把一条**相对路径**记进生成的工程里：那份工程里
          # `BuildTask.kt` 的 `workingDir = File(projectDir, rootDirRel)` = `src-tauri`，回头调用 CLI 时
          # `src-tauri/src-tauri/tauri.conf.json` 是不存在的。
          "$TAURI" android init
          ls -1 src-tauri/gen/android

      # run #13 的整段日志（走 commit 评论那条通道拿到的）把根因钉死了：
      # `Execution failed for task ':app:rustBuildArm64Debug' (registered by plugin 'rust')`
      # → `Process 'command 'node'' finished with non-zero exit value 1`
      # → `Error: Cannot find module '/…/apps/mobile/src-tauri/tauri'`（`requireStack: []`，栈顶是
      # `Module.executeUserEntryPoint` ⇒ node 是**以 `tauri` 为主脚本**启动的）。
      # 生成的 `buildSrc/.../BuildTask.kt` 里写着 `executable = """<记录下来的命令的头一节>"""` 和
      # `args = listOf(<记录的其余各节>, …)`，而 `workingDir` 是 `<app>/src-tauri`（模板：
      # tauri-cli/templates/mobile/android/buildSrc/src/main/kotlin/BuildTask.kt，本批照着仓库原文读过）。
      # 也就是说：**gradle 会按"当初怎么启动 CLI 的那串字"回头再叫一次 CLI**，而那串字是相对启动目录的。
      # 支持的叫法（`pnpm <脚本名> …`）记下来的是 `pnpm run <脚本>`，换目录也能解；我们按绝对路径叫 shim，
      # 记下来的是相对那一节的 `tauri`，在 src-tauri 里就什么都不是。这里把两节钉成绝对路径。
      # run #14 的账：这一步**自己红了，于是后面整段 gradle 日志一起没了**，而那一步才是我要的读数。
      # 递证据的机器不能挡路 —— 改成"失败也继续"，读数全进 /tmp/diag/patch.txt，由贴评论那步递出去。
      # 真正的门禁没有松开：补丁没钉上，gradle 一样会在同一个地方红。
      - name: 把生成工程里"回头叫 CLI"那两行钉成绝对路径
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/diag
          GEN="$GITHUB_WORKSPACE/apps/mobile/src-tauri/gen/android"
          CLI="$GITHUB_WORKSPACE/apps/desktop/node_modules/@tauri-apps/cli/tauri.js"
          {
            echo "CLI=$CLI 存在吗：$(test -f "$CLI" && echo yes || echo NO)"
            # **别猜路径**：run #15 就是猜错的 —— 我以为在 `buildSrc/src/main/kotlin/`，
            # 实际生成在 `buildSrc/src/main/java/app/notera/kotlin/BuildTask.kt`（按应用包名落的目录），
            # 于是"这一步成功、文件一个没改"，gradle 里跑的还是那串相对路径。
            # 现在按文件名找：找不到就红（不静默），找到几个钉几个。
            mapfile -t BTS < <(find "$GEN" -type f -name BuildTask.kt)
            echo "找到 ${#BTS[@]} 个 BuildTask.kt"
            printf '  %s\n' "${BTS[@]}"
            for BT in "${BTS[@]}"; do
              echo "--- 钉之前：$BT"
              grep -n -E "val executable|val args = listOf|workingDir" "$BT" | cut -c1-300
              node scripts/patch-android-buildtask.mjs "$BT" "$CLI"
              echo "  patch-rc=$?"
              echo "--- 钉之后：$BT"
              grep -n -E "val executable|val args = listOf" "$BT" | cut -c1-300
            done
          } > /tmp/diag/patch.txt 2>&1
          head -40 /tmp/diag/patch.txt
          # 三条判据都收口在"读数"上，而不是信这一步自己说了什么：
          # 找没找到 / 每次钉的 rc / 钉完那两行长什么样。
          [ "${#BTS[@]}" -gt 0 ] || { echo "生成的工程里一个 BuildTask.kt 都没有"; exit 1; }
          grep -q "patch-rc=0" /tmp/diag/patch.txt || { echo "补丁一次都没钉上（见上面 patch-rc）"; exit 1; }
          if grep -E "patch-rc=[1-9]" /tmp/diag/patch.txt; then echo "有文件没钉上（上面那条 patch-rc 非 0）"; exit 1; fi

      - name: 出 APK（debug 签名 = Android SDK 自带的 debug keystore，不需要 secrets）
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/apps/desktop/node_modules/.bin/tauri" android build --apk --debug --target aarch64 2>&1 | tee /tmp/apk.log

      # §4 那句"确保各平台包可正常安装、启动和进行基础功能验证"在 Android 这一腿上，
      # 不依赖设备能读出来的部分（CI-CD.md L6 承诺的结构校验）。**读不到就红，不许静默跳过**：
      # 装上但一开就崩的 APK 在"job 绿"里是看不出来的（缺 native 库、versionName 退回 1.0 都属这一类）。
      - name: 结构校验这份 APK（包名 / versionName / native 库 / 可启动入口）
        run: |
          set -uo pipefail
          mkdir -p /tmp/diag
          GEN="$GITHUB_WORKSPACE/apps/mobile/src-tauri/gen/android"
          # run #16 的账：APK **已经出得来**（`出 APK` = success），红的是这一步，
          # 而我在这一步外面看不到任何东西 —— 期望错了还是包真的缺东西，分不开。
          # 所以不管过不过，都把 badging 与 `aapt list` 的**原文形状**留在 /tmp/diag/apkcheck.txt 里，
          # 由下面那条贴评论的通道递出来。门禁本身不放松（该红就红）。
          APK=$(find "$GEN" -path '*/outputs/apk/*.apk' -type f | head -1)
          AAPT=$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | tail -1 || true)
          {
            echo "APK=[$APK]"
            echo "AAPT=[$AAPT]"
            echo "build-tools 目录=$(ls -1 "$ANDROID_HOME"/build-tools 2>/dev/null | tr '\n' ' ')"
          } > /tmp/diag/apkcheck.txt
          if [ -z "$APK" ]; then echo "APK 找不到" >> /tmp/diag/apkcheck.txt; cat /tmp/diag/apkcheck.txt; exit 1; fi
          if [ -z "$AAPT" ]; then echo "runner 里没有 aapt —— 无法校验，按红算" >> /tmp/diag/apkcheck.txt; cat /tmp/diag/apkcheck.txt; exit 1; fi
          "$AAPT" dump badging "$APK" > /tmp/apk-badging.txt 2>>/tmp/diag/apkcheck.txt
          "$AAPT" list "$APK" > /tmp/apk-list.txt 2>>/tmp/diag/apkcheck.txt
          {
            echo "--- badging 全文（去掉进度控制符）"
            sed -e 's/\x1b\[[0-9;?]*[a-zA-Z]//g' /tmp/apk-badging.txt | tr -d '\000' | head -25
            echo "--- list 里与前端有关的行"
            grep -Ei '\.js$|\.html$|^assets/|res/raw' /tmp/apk-list.txt | head -25
            echo "--- 门禁读数"
            node scripts/check-apk-badging.mjs /tmp/apk-badging.txt \
              --version "${{ needs.meta.outputs.version }}" --list /tmp/apk-list.txt
          } >> /tmp/diag/apkcheck.txt 2>&1
          rc=$?
          cat /tmp/diag/apkcheck.txt
          if [ "$rc" -eq 0 ]; then
            {
              echo "### Android 产物核对（§4）"
              echo "- 文件：\`$(basename "$APK")\`（$(wc -c <"$APK") 字节）"
              echo "- SHA-256：\`$(sha256sum "$APK" | cut -c1-64)\`"
              echo "- 打进包里的 JS 资产：$(grep -c -E '\.js$' /tmp/apk-list.txt) 项"
              grep -E "^package:|^sdkVersion:|^native-code:|^launchable-activity:" /tmp/apk-badging.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

      # **两条读数通道**（都是本批实测出来的，不是推测）：
      # ① 未认证能读 `/actions/runs/{id}/artifacts` 的**名字**，读不到日志正文（job logs = 403），
      #    也读不到产物字节（artifact zip = **401 Requires authentication**）。于是把最要紧的几行
      #    **编进产物名字**：名字只允许 `[A-Za-z0-9._-]`，其余换成 `-`，每条 90 字、12 条 ≈ 1000 字。
      # ② 这个 workflow 本来就有 `contents: write` ⇒ job 里有 GITHUB_TOKEN ⇒ 可以把日志**贴成 commit 评论**，
      #    而评论列表未认证可读（实测 `GET /repos/{owner}/{repo}/commits/{sha}/comments` = 200）。
      #    一次就能递出整段 gradle 输出，比①强得多；①保留当兜底（万一评论被限流）。
      # 修好 Android 之后这两步连同注释都该删掉 —— 它们是给"读不到日志"这个环境限制打的补丁，不是长期行为。
      - name: 把失败日志贴成 commit 评论（有 token 就能全文递出来）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          GEN="$GITHUB_WORKSPACE/apps/mobile/src-tauri/gen/android"
          mkdir -p /tmp/diag
          # run #14 的账（第三条）：这一步以前**假定红的是"出 APK"那一步** —— 那次红在前面的钉补丁那步，
          # `/tmp/apk.log` 根本不存在 ⇒ 整条评论没建起来（我去读评论列表 = 0 条，什么读数都没有）。
          # 递证据的步骤要在"前面任何一步坏了"时照样递得出东西，所以缺的日志先补一个空文件。
          touch /tmp/apk.log /tmp/diag/patch.txt
          # 清洗那步**必须在这一步里自己做**：`apk.clean.log` 是后面"编进产物名"那步的产物，
          # 上一步在这里读它 = 读一个当时还不存在的文件 ⇒ "关键行"那一节整段是空的
          # （run #13 就是空的，我还当"没有错误行"读了半天）。递证据的步骤不能依赖别人的顺序。
          sed -e 's/\x1b\[[0-9;?]*[a-zA-Z]//g' -e 's#/home/runner/work/Noto/Noto/#~/#g' /tmp/apk.log 2>/dev/null \
            | tr -d '\000' > /tmp/apk.clean.log || true
          {
            echo "### Android 出包失败的现场（诊断贴文，修好就删）"
            echo '```'
            tail -c 30000 /tmp/apk.log
            echo ''
            echo '### 关键行（ANSI 与 NUL 已洗）'
            grep -n -E "Cannot find module|Require stack|Execution failed|error:|exited with code" /tmp/apk.clean.log | head -40
            echo '### BuildTask.kt 里"回头叫 CLI"那几行（补丁到底在不在，看这里）'
            # 同样**按名字找**，不猜路径（run #15 的教训：真身在 buildSrc/src/main/java/app/<包名>/kotlin/ 下）
            find "$GEN" -type f -name BuildTask.kt -exec grep -n -E "val executable|val args = listOf|workingDir" {} \; 2>/dev/null | cut -c1-500
            echo '### app/build.gradle.kts 的 rust 块（rootDirRel 决定回头调用的 cwd）'
            grep -n -A3 "^rust" "$GEN/app/build.gradle.kts" 2>/dev/null | cut -c1-200
            echo '### 补丁那一步自己的读数'
            cat /tmp/diag/patch.txt 2>/dev/null
            echo '### 结构校验那一步的完整读数（含 badging 与 aapt list 的原文形状）'
            cat /tmp/diag/apkcheck.txt 2>/dev/null
            echo '```'
          } > /tmp/diag/comment.md
          # JSON 转义交给 node（这个 job 里本来就有 node），不手搓引号。
          node -e 'const fs=require("fs");const b=fs.readFileSync("/tmp/diag/comment.md","utf8").slice(0,60000);fs.writeFileSync("/tmp/diag/body.json",JSON.stringify({body:b}));'
          curl -sS -o /tmp/diag/comment-resp.json -w "HTTP=%{http_code}\n" -X POST \
            -H "authorization: Bearer $GH_TOKEN" \
            -H "accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${GITHUB_SHA}/comments" \
            --data @/tmp/diag/body.json
          # 上一条**不带 `|| echo`**：run #12 就是被 `|| echo` 骗过的 —— 那次 URL 写错（POST 到
          # `/comments/{sha}` 那是"改/删某条评论"的形状，创建要 `/commits/{sha}/comments`），
          # curl `-f` 退出 22，被 `|| echo` 吞掉之后这一步报的是 success。**递证据的步骤自己假绿，
          # 比没有证据更糟** —— 它会让人以为已经拿到读数。失败要响。
          head -c 300 /tmp/diag/comment-resp.json
          grep -q '"html_url"' /tmp/diag/comment-resp.json || { echo "评论没建起来（见上面的 HTTP 与响应头）"; exit 1; }

      - name: 摘出事实与错误行（编进产物名递出来）
        if: failure()
        id: smuggle
        run: |
          set -u
          mkdir -p /tmp/diag
          # 先把 ANSI 颜色码与 **NUL 字节** 一起洗掉：`KEY=$(grep …)` 在 bash 里会在 NUL 处截断，
          # run #9 那条"Cannot find module '…/tauri-"**引号都没闭合**就是这件事的形状
          # （83 字整、后面全没了）—— 命令行进度条爱写控制字符，这里连 NUL 一起丢。
          # 再把 `/home/runner/work/Noto/Noto/` 这个 26 字前缀折成 `~/` —— **一个槽只有 84 字**，
          # 不折的话栈帧里"到底是哪个文件 require 的"正好被挤到槽外面（本机复演时就是这么暴露的）。
          sed -e 's/\x1b\[[0-9;?]*[a-zA-Z]//g' -e 's#/home/runner/work/Noto/Noto/#~/#g' /tmp/apk.log | tr -d '\000' > /tmp/apk.clean.log 2>/dev/null || cp /tmp/apk.log /tmp/apk.clean.log
          # run #6~#9 四轮教的东西：位置要在失败之后（#6）、工作目录不继承会量到外面（#7 之前那次）、
          # 一个槽装不下整行要切片（#8）、而**下一行往往是 stack frame 不是答案**（#9）——
          # 所以 S1..S4 取命中行之后的四行：Node 的调用者文件就写在深一点的栈帧里。
          KEY=$(grep -E "Cannot find module" /tmp/apk.clean.log | head -1)
          [ -z "$KEY" ] && KEY=$(grep -E -i 'error|FAILURE|Caused by' /tmp/apk.clean.log | tail -1)
          # run #14 之后最值钱的一格变成了"钉补丁那一步看到了什么"（那步已经不挡路了，读数在 patch.txt 里）。
          # G1 = BuildTask.kt 里 `val executable` 那一行的**当前形状**（模板到底渲染成了什么），
          # G2 = `val args = listOf` 那一行，G3 = patch.txt 的头两行结论（BT/CLI 存在吗）。
          # 三格都先折掉 26 字的 runner 前缀，不然槽位预算全被路径吃掉。
          GEN="$GITHUB_WORKSPACE/apps/mobile/src-tauri/gen/android"
          BT=$(find "$GEN" -type f -name BuildTask.kt | head -1)
          G1=$(grep -m1 "val executable" "$BT" 2>/dev/null | sed -e 's#/home/runner/work/Noto/Noto/#~/#g' | cut -c1-160)
          G2=$(grep -m1 "val args = listOf" "$BT" 2>/dev/null | sed -e 's#/home/runner/work/Noto/Noto/#~/#g' | cut -c1-160)
          # 这两格读的是**钉完之后**的文件；钉补丁那步若在中途抛错，文件保持原状 ⇒ 读到的就是模板原样，
          # 两种情况都值钱。第三格读那步自己写的结论（BT/CLI 存不存在 + 它自己说了什么）。
          G3=$(head -3 /tmp/diag/patch.txt 2>/dev/null | sed -e 's#/home/runner/work/Noto/Noto/#~/#g' | tr '\n' '|' | cut -c1-160)
          S1=$(grep -A1 -E "Cannot find module" /tmp/apk.clean.log | sed -n '2p')
          {
            echo "F|gen-mobile=$(test -d "$GEN" && echo yes || echo no)"
            echo "K0|p"
            echo "G1|p"; echo "G2|p"; echo "G3|p"
            echo "F|task=$(grep -o 'Execution failed for task [^ ]*' /tmp/apk.clean.log | head -1 | tr ' ' '_')"
            echo "S1|p"
            grep -E -i 'error|FAILURE|Caused by|panicked|not found|No such|denied|cannot|failed|task' /tmp/apk.clean.log | tail -4 | sed 's/^/E|/'
          } > /tmp/diag/index.txt
          awk -v k0="$(printf '%s' "$KEY" | cut -c1-84)" -v g1="$G1" -v g2="$G2" -v g3="$G3" -v s1="$S1" '
            NR == 2 { print "K0|" substr(k0, 1, 84);    next }
            NR == 3 { print "G1|" substr(g1, 1, 84);    next }
            NR == 4 { print "G2|" substr(g2, 1, 84);    next }
            NR == 5 { print "G3|" substr(g3, 1, 84);    next }
            NR == 7 { print "S1|" substr(s1, 1, 84);    next }
            { print }
          ' /tmp/diag/index.txt > /tmp/diag/sliced.txt
          mv /tmp/diag/sliced.txt /tmp/diag/index.txt
          # 十二个槽位**总是**写满：产物名不能带非法字符，空名会撞 GitHub 的命名校验，
          # 所以缺的行填 none —— "槽位是空的"本身也是读数。
          awk -v want=12 '
            { lines[NR] = $0 }
            END { for (i = 1; i <= want; i++) print (i in lines ? lines[i] : "none") }
          ' /tmp/diag/index.txt > /tmp/diag/padded.txt
          mv /tmp/diag/padded.txt /tmp/diag/index.txt
          # 十二个槽位**总是**写满：产物名不能带非法字符，空名会撞 GitHub 的命名校验，
          # 所以缺的行填 none —— "槽位是空的"本身也是读数。
          awk -v want=12 '
            { lines[NR] = $0 }
            END { for (i = 1; i <= want; i++) print (i in lines ? lines[i] : "none") }
          ' /tmp/diag/index.txt > /tmp/diag/padded.txt
          i=0
          while IFS= read -r line; do
            i=$((i + 1))
            mkdir -p "/tmp/diag/$i"
            printf '%s\n' "$line" > "/tmp/diag/$i/line.txt"
            sig=$(printf '%s' "$line" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-90)
            echo "sig$i=$sig" >> "$GITHUB_OUTPUT"
          done < /tmp/diag/padded.txt
          cat /tmp/diag/index.txt
          echo "共递出 $i 条"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-diag-01-${{ steps.smuggle.outputs.sig1 }}
          path: /tmp/diag/1/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-diag-02-${{ steps.smuggle.outputs.sig2 }}
          path: /tmp/diag/2/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-diag-03-${{ steps.smuggle.outputs.sig3 }}
          path: /tmp/diag/3/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-diag-04-${{ steps.smuggle.outputs.sig4 }}
          path: /tmp/diag/4/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-diag-05-${{ steps.smuggle.outputs.sig5 }}
          path: /tmp/diag/5/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-diag-06-${{ steps.smuggle.outputs.sig6 }}
          path: /tmp/diag/6/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-diag-07-${{ steps.smuggle.outputs.sig7 }}
          path: /tmp/diag/7/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-diag-08-${{ steps.smuggle.outputs.sig8 }}
          path: /tmp/diag/8/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-diag-09-${{ steps.smuggle.outputs.sig9 }}
          path: /tmp/diag/9/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-diag-10-${{ steps.smuggle.outputs.sig10 }}
          path: /tmp/diag/10/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-diag-11-${{ steps.smuggle.outputs.sig11 }}
          path: /tmp/diag/11/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-diag-12-${{ steps.smuggle.outputs.sig12 }}
          path: /tmp/diag/12/
          if-no-files-found: ignore

      # `if: always()` 是这批改的必然结果：**产物先上传，校验后判**。
      # run #16 里 APK 已经出得来了，但我那条新加的校验红在后面，于是"收集产物"被 skipped ——
      # §4 要的"产物可作为 Actions Artifacts 下载"这一格就因为我自己的门禁而没东西可下。
      # 校验该红还是要红（不许放松），但不该把包一起带走。
      # 顺手去掉 `apps/desktop/…/gen/android/**` 那条 glob：移动壳从 run #6 起就固定在 apps/mobile，
      # 桌面那个目录根本不会存在（§45：留一条永远不会命中的路径，等于写下"这里也许还会出包"的假话）。
      - name: 收集产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  publish:
    name: 汇总到 GitHub Release（草稿）
    needs: [meta, windows, macos, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 取回三平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      # 说明正文取自 CHANGELOG 里对应版本那一段。这一仓库的 CHANGELOG 不按 `## 0.0.40` 分段
      # （它是"开发线 + 每批一条产品决定"的形状，见 §5 的说明），但每条产品批次的标题里带着
      # **版本对**（`版本 0.0.39 → 0.0.40`）—— 那就是这一版的条目。取不到就明写缺项，
      # 不留空说明：§5 要求"发布版本时应同步更新版本号、构建产物和更新说明"，缺东西要看得见。
      - name: 组装修订说明
        run: |
          set -euo pipefail
          v="${{ needs.meta.outputs.version }}"
          {
            echo "## Notera $v"
            echo
            echo "本 Release 由 tag \`v$v\` 的推送自动构建（\`.github/workflows/release.yml\`）。"
            echo
            echo "**产物状态**：Windows 安装包由 GNU 工具链产出（本机与 CI 同一条口径）；macOS 包**未经代码签名与公证**，首次打开需要在系统设置里手动允许；Android 的 APK 由 debug keystore 签名（无发布 secrets），未经 Play 上架验证。"
            echo
            echo "### CHANGELOG 里对应这一版的那一条"
            echo
            awk -v v="$v" '
              BEGIN { hit = 0 }
              /^- \*\*/ { if (hit) exit; if (index($0, "→ " v) > 0) hit = 1 }
              hit { print }
            ' CHANGELOG.md > /tmp/section.md
            if [ -s /tmp/section.md ]; then
              cat /tmp/section.md
            else
              echo "> ⚠ CHANGELOG.md 里找不到标着「版本 … → $v」的那一条 —— 发布说明缺项，补完再 Publish。"
            fi
          } > RELEASE-NOTES.md
          cat RELEASE-NOTES.md

      - name: 建 Release 草稿
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ needs.meta.outputs.version }}"
          shasum -a 256 dist-artifacts/* > dist-artifacts/SHA256SUMS.txt || true
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" dist-artifacts/* --clobber
          else
            gh release create "v$v" dist-artifacts/* \
              --title "Notera $v" \
              --notes-file RELEASE-NOTES.md \
              --draft \
              --target "$GITHUB_SHA"
          fi
          echo "Release 草稿已建好（draft）：https://github.com/${{ github.repository }}/releases —— 检查后手动 Publish" \
            >> "$GITHUB_STEP_SUMMARY"
