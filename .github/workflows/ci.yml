name: PR 门禁（G1 的第一层）

# 只放**本机逐条跑过**的命令。本机到 GitHub 不可达，所以这份 workflow 的**首次运行结果未知**：
# 按 §40 记为待回贴证据，不当成已通过。跑不了的步骤显式排除并写明原因，不留"应该会过"的假象。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 仓库只用 GNU 工具链（MSVC host 在本项目不可编译，见 CI-CD §0）
  RUST_TARGET: x86_64-pc-windows-gnu

jobs:
  gates:
    name: 静态 + 单测 + 集成（Windows / GNU）
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # MinGW-w64 是 windows-latest 镜像里带的，但版本与 windres/dllwrap 是否在 PATH
      # 未在本机验证过 —— 若 `cargo test --workspace` 报链接器缺失，看这一行的输出定位。
      - name: 安装 GNU 工具链（rustup）
        run: |
          rustup toolchain install stable-$env:RUST_TARGET --profile minimal --component rustfmt --component clippy
          rustup default stable-$env:RUST_TARGET
          rustc -Vv
          cargo -V

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 仓库里现在有**两份**锁文件（package-lock.json 与 pnpm-lock.yaml）。本机所有门禁结论
      # 都是在 npm + package-lock 上跑出来的，所以 CI 先跟本机一致用 npm ci；收敛到单一包
      # 管理器是另一件事，不在这一步偷偷改（否则 CI 装的依赖与本地验过的就不是同一套）。
      - name: 依赖安装（npm ci，与本机验证所用的一致）
        working-directory: apps/desktop
        run: npm ci

      - name: 版本单源（CI-CD §版本与单一版本源）
        run: node scripts/check-versions.mjs

      - name: 架构适应度 + §26 无障碍 + 扫描台账（26 条）
        run: node scripts/arch-check.mjs

      # 本机跑不了 cargo fmt（工具链没装 rustfmt 组件，§40 记着 BLOCKED），所以这一步
      # 是**第一次**真正检查格式漂移：红了就是漂移的真实信号，本地 `cargo fmt --all` 后再推。
      # 先不设为必需，免得把整条 CI 卡在一个本机无从验证的步骤上。
      - name: 格式检查（本机无法验证，先不阻断）
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Clippy（-D warnings，与本地同一条命令）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust 全量（本机基线 487 通过 / 58 个测试二进制）
        run: cargo test --workspace

      - name: 前端单测（本机基线 190 通过 / 20 文件）
        working-directory: apps/desktop
        run: npm test

      - name: 前端类型检查
        working-directory: apps/desktop
        run: npm run typecheck

      - name: 前端构建（真窗口与桌面壳内嵌的就是这份产物）
        working-directory: apps/desktop
        run: npm run build

      # 契约图要一个可用的 chromium；脚本里写死的是本机路径，CI 上要么找不到浏览器
      # 要么装到别处 —— 所以这一步也先不阻断，等首次运行看清实际行为再收紧。
      - name: 契约图（本机基线 59/59；CI 里浏览器路径未验证，先不阻断）
        continue-on-error: true
        run: node scripts/verify-diagram.mjs

      - name: 产物一致性（release 构建能出来，但不做签名/打包）
        run: cargo build --release -p notera-desktop
        timeout-minutes: 60

  # 显式**不在这里跑**的（跑不了就是跑不了，不写成通过）：
  #   · scripts/verify-app.mjs、scripts/verify-blackbox.mjs —— 要 headed/可用的 WebView2 +
  #     本地 dev 桥；CI 镜像里没有 WebView2 运行时，装出来也是无头 Chromium，
  #     拿它当"真窗口验过"就是自欺。这两条留在本机跑（本机实测：35/35、纯黑盒 11 连绿）。
  #   · scripts/verify-tauri-window.mjs —— 同上，且要 CDP 9223 attach 到真壳。
  #   · macOS / Android / iOS 三产物 —— 需要对应 runner 与证书，按 §40 仍是 BLOCKED。
  #   · 真实公网 WebDAV 矩阵 —— 需要用户提供端点，CI 里只碰 notera-test-webdav。
