name: PR 门禁（G1 的第一层）

# 只放**本机逐条跑过**的命令。本机到 GitHub 不可达，所以这份 workflow 的**首次运行结果未知**：
# 按 §40 记为待回贴证据，不当成已通过。跑不了的步骤显式排除并写明原因，不留"应该会过"的假象。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 仓库只用 GNU 工具链（MSVC host 在本项目不可编译，见 CI-CD §0）
  RUST_TARGET: x86_64-pc-windows-gnu

jobs:
  gates:
    name: 静态 + 单测 + 集成（Windows / GNU）
    runs-on: windows-latest
    # 「失败递证据」那一步要贴 commit 评论 —— 未认证读不到 job 日志（403）时，
    # 这是"红在哪儿"的公开读法（形状与五条纪律见那一步自己的注释）。
    # 这是本 job 里唯一需要写权限的地方，其余步骤都是只读。
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # MinGW-w64 是 windows-latest 镜像里带的，但版本与 windres/dllwrap 是否在 PATH
      # 未在本机验证过 —— 若 `cargo test --workspace` 报链接器缺失，看这一行的输出定位。
      - name: 安装 GNU 工具链（rustup）
        run: |
          rustup toolchain install stable-$env:RUST_TARGET --profile minimal --component rustfmt --component clippy
          rustup default stable-$env:RUST_TARGET
          rustc -Vv
          cargo -V

      # 包管理器已按 2026-09-27 的决定收敛到 **pnpm**：仓库里只留 `apps/desktop/pnpm-lock.yaml`，
      # `package-lock.json` 同时删除 —— 两份锁的害处不是"难看"，是 CI 装的依赖与本机验过的
      # 依赖可能不是同一套，而这类差异最后表现为"CI 红/本地绿"或反过来，且没人知道信谁。
      # 版本由 apps/desktop/package.json 的 `packageManager` 字段钉住；这一步要排在 setup-node
      # 之前，否则 pnpm 的依赖缓存拿不到 lockfile 就命中不了。
      # `package_json_file` 不是可有可无的装饰：本仓库**根目录没有 package.json**（前端在
      # apps/desktop），而该 action 默认去仓库根读 `packageManager` —— 读不到就直接失败。
      # run #5 就是这样红的：第 4 步"准备 pnpm"失败，一条构建都没开始。这个坑只有 CI 能暴露，
      # 因为本机 pnpm 是全局装的，永远不会去找根 package.json。
      - name: 准备 pnpm（版本取自 apps/desktop/package.json 的 packageManager）
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # 本机实测（pnpm 12.5.1）：`pnpm install --frozen-lockfile` 726 ms 通过、锁与
      # package.json 一致、供应链策略校验通过；随后 test/typecheck/build 三条结论与
      # 之前 npm 那套**一字不差**（200/200、0 类型错、产物 index-CLVRbH5e.js 216.65 kB
      # → gzip 74.22 kB）。也就是说这次收敛换的是工具，不是依赖内容。
      - name: 依赖安装（frozen lockfile，装的就是本机验过的那套）
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # 首次运行（run #1）就是死在这之后：clippy 会编译桌面壳，而它的 build.rs 要把
      # `frontendDist` 嵌进二进制 —— 没构建前端就没有可嵌的东西。本机永远有一份旧的
      # dist，所以这条差异在本地看不见。前端构建因此**挪到所有 Rust 步骤之前**。
      - name: 前端构建（真窗口与桌面壳内嵌的就是这份产物）
        working-directory: apps/desktop
        run: pnpm build

      - name: 版本单源（CI-CD §版本与单一版本源）
        run: node scripts/check-versions.mjs

      - name: 架构适应度 + §26 无障碍 + 扫描台账 + CI 门禁对账（本机基线 34/34，2026-10-09 实测）
        run: node scripts/arch-check.mjs

      # 图标这条必须阻断：0.0.63 之前那批是纯色方块（1 种颜色、ico 单帧、压根没有 .icns），
      # 文件全在、构建全绿，只有用户看得见它是灰块 —— 所以判据打在像素上，不打在"文件存在"上。
      - name: 图标（像素里有字形 + 多帧 ico + icns 存在 + 两壳同源）
        run: node scripts/check-icons.mjs

      # 品牌名逐点核对 + 可见层全量扫旧名；identifier 反向钉死，防止"顺手改名"把数据目录换掉。
      - name: 品牌名（可见层统一 Noto / identifier 保持 app.notera / 旧名 0 残留）
        run: node scripts/check-brand.mjs

      # 本机 rustfmt 组件已装上并跑过 `cargo fmt --all`（当时发现 92 个文件有漂移，已单独
      # 提交格式化），所以这一步现在是**硬门禁**：`--check` 在本机退出码 0。
      - name: 格式检查（本机已可验证，阻断）
        run: cargo fmt --all --check

      - name: Clippy（-D warnings，与本地同一条命令）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust 全量（本机基线 640 通过 / 0 失败 / 6 ignored，85 个 result 行；串行跑，见下面那条注释）
        # `--test-threads=1` 不是习惯，是判据：`notera-test-webdav` 的
        # `latency_injection_delays_responses` 量的是墙钟（"控制面必须即时"），
        # 同一个二进制里那十几条并发打服务器时，机器一忙就假红 —— 本机 2026-09-28
        # 连红三次、`--test-threads=1` 立刻 16/16。红一次要人重跑并怀疑产品，
        # 比 CI 多花两分钟贵。
        # 输出**落盘一份**：下一步失败时贴成 commit 评论（日志端点 403，那条是唯一读法）。
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.logs-ci"
          set -o pipefail
          cargo test --workspace -- --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/.logs-ci/cargo-test.txt"

      # （失败递证据那一步挪到 job **末尾**了 —— `if: failure()` 只看**它之前**的步：第一版放在这里，
      #  2026-10-10 第 16 步「前端单测」红的时候它已经被"过去"了、照样 skipped，读数一条都没递出来。
      #  末尾那一步同时读 cargo 与 pnpm 两份输出。）

      - name: 前端单测（本机基线 559 通过 / 67 文件，2026-10-09 实测）
        working-directory: apps/desktop
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.logs-ci"
          set -o pipefail
          pnpm test 2>&1 | tee "$GITHUB_WORKSPACE/.logs-ci/pnpm-test.txt"

      - name: 前端类型检查
        working-directory: apps/desktop
        run: pnpm typecheck

      # 依赖漏洞审计。这一步显式指向公共 registry：本机全局 registry 是 npmmirror，它没有 audit 端点。
      # **更正（2026-10-09）**：这里原先写着"本机 BLOCKED、从来没在这台机器上验过"—— 那是不实的话：
      # 带上 `--registry=https://registry.npmjs.org` 本机就能跑，而 `source-map-js` 那条 high 正是本机先报出来的。
      # 这也是台账里 G12 那条的解除条件，已经解除。
      # 本机 2026-10-09 实测：锁里 278 个包 **0 条**（`pnpm update source-map-js` 把 1.2.1 推到 1.2.2 之后）；
      # 退回 1.2.1 那把锁跑同一条命令 ⇒ 1 条 high、退出码 1，判据不是空转。
      # 更早的一次空转自检（axios@0.21.0 + minimist@1.2.5 的临时工程报 26 条、退出码 1）仍然有效。
      - name: 前端依赖漏洞审计（high 及以上阻断）
        working-directory: apps/desktop
        run: pnpm audit --audit-level=high --registry=https://registry.npmjs.org

      # Rust 那半边的依赖审计。原先脚本头注释写着"CI 里也是这条"而**CI 里根本没有这一步**
      # —— 那是 §45 意义上的假账，2026-09-30 对文档时才发现，所以这一步是补账不是加功能。
      # 先跑判据（`--self-test`：已知有漏洞的 6 个必须报、已知干净的 2 个必须不报，其中
      # rustls / rustls-webpki / ring 三条是 TLS 那半张图的正向对照），红了就没必要看下一条；
      # 再跑全量（`Cargo.lock` 624 个 name@version + 2062 条依赖边的对账，覆盖不全直接硬失败）。
      # 本机 2026-09-30 实测：SELF-TEST 退出码 0；全量 PASS · 624 个 0 条未豁免（3 条豁免逐条有理由）。
      # **披露**：这两步会把依赖的名字与版本发给外部服务 api.osv.dev（不含代码、路径、凭据），
      # 与上面 `pnpm audit` 指向公共 registry 是同一类外发。
      - name: Rust 依赖漏洞审计 · 判据自测（阻断）
        run: node scripts/audit-rust-deps.mjs --self-test

      - name: Rust 依赖漏洞审计 · 全量（阻断）
        run: node scripts/audit-rust-deps.mjs

      # 契约图要一个可用的 chromium；脚本里写死的是本机路径，CI 上要么找不到浏览器
      # 要么装到别处 —— 所以这一步也先不阻断，等首次运行看清实际行为再收紧。
      - name: 契约图（本机基线 59/59；CI 里浏览器路径未验证，先不阻断）
        continue-on-error: true
        run: node scripts/verify-diagram.mjs

      - name: 产物一致性（release 构建能出来，但不做签名/打包）
        run: cargo build --release -p notera-desktop
        timeout-minutes: 60

      # 红的时候把两份输出（cargo test / pnpm test）的尾巴贴成 commit 评论（公开仓库、未认证可读；日志端点 403）。
      # **必须排在 job 最后**：`if: failure()` 只看**它之前**的步 —— 第一版放在第 14 步后面，
      # 2026-10-10 第 16 步「前端单测」红的那次它已经被"过去"了、照样 skipped，读数没递出来。
      # 其余纪律照旧：绝对路径；先 touch 再读；自己 continue-on-error（不许把 job 带走）；
      # 把两份日志各读了几个字符写进正文（它显示 success 也不代表评论建成了）。
      - name: 失败递证据（cargo / pnpm 输出 → commit 评论）
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.logs-ci"
          touch "$GITHUB_WORKSPACE/.logs-ci/cargo-test.txt" "$GITHUB_WORKSPACE/.logs-ci/pnpm-test.txt"
          node -e '
            const fs = require("fs");
            const read = (n) => {
              try { return fs.readFileSync(process.env.GITHUB_WORKSPACE + "/.logs-ci/" + n, "utf8"); }
              catch (e) { return "(读不到 " + n + "：" + e.code + ")"; }
            };
            const cargo = read("cargo-test.txt");
            const pnpm = read("pnpm-test.txt");
            const head = `CI 失败递证据（job ${process.env.GITHUB_JOB}，run ${process.env.GITHUB_RUN_ID}）\n`
              + `cargo-test ${cargo.length} 字符 / pnpm-test ${pnpm.length} 字符，各自尾部 20000 字符：\n\n`;
            const body = (head + "```\ncargo:\n" + cargo.slice(-20000) + "\n```\n\n```\npnpm:\n" + pnpm.slice(-20000) + "\n```").slice(0, 64000);
            fs.writeFileSync(process.env.GITHUB_WORKSPACE + "/.logs-ci/comment.json", JSON.stringify({ body }));
          '
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input "$GITHUB_WORKSPACE/.logs-ci/comment.json"
          echo "comment_rc=$?（这一步显示 success 也不代表评论建成了，以这个 rc 与评论列表为准）"

  # 显式**不在这里跑**的（跑不了就是跑不了，不写成通过）：
  #   · scripts/verify-app.mjs、scripts/verify-blackbox.mjs、scripts/verify-p11-panel.mjs ——
  #     要 headed/可用的 WebView2 + 本地 dev 桥；CI 镜像里没有 WebView2 运行时，装出来也是
  #     无头 Chromium，拿它当"真窗口验过"就是自欺。这三条留在本机跑（本机最新实测：
  #     36/36、10/10（独立空库）、11/11）。
  #   · scripts/verify-perf.mjs —— 要真实 release 壳 + 预先灌好的几千条库，且读数是**这台机器**
  #     的绝对值，换 runner 就没可比性；它是基线采集器，不是放行门。
  #   · scripts/verify-tauri-window.mjs —— 同上，且要 CDP 9223 attach 到真壳。
  #   · macOS / Android / iOS 三产物 —— 需要对应 runner 与证书，按 §40 仍是 BLOCKED。
  #   · 真实公网 WebDAV 矩阵 —— 需要用户提供端点，CI 里只碰 notera-test-webdav。
