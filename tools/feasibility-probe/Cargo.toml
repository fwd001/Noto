[package]
name = "feasibility_probe"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm-siv = "0.12.1"
argon2 = "0.6.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["socks", "blocking", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "fs"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }
